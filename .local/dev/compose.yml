services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: odorobo-etcd
    hostname: etcd
    restart: "no"
    command:
      - /usr/local/bin/etcd
      - --name=odorobo-dev-etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=odorobo-dev-etcd=http://etcd:2380
      - --initial-cluster-state=new
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ceph:
    build:
      context: ./ceph
      dockerfile: Containerfile
      args:
        CEPH_IMAGE: ${CEPH_IMAGE:-quay.io/ceph/ceph:v20.2.3}
    image: odorobo-ceph:local
    container_name: odorobo-ceph
    hostname: ceph
    privileged: true
    # Bootstrap errors must leave the container stopped so `init.sh` can report
    # them instead of silently repeating a failed initialization.
    restart: "no"
    environment:
      CEPH_MON_IP: ${CEPH_MON_IP:-127.0.0.1}
      CEPH_POOL: ${CEPH_POOL:-odorobo-blockpool}
      CEPH_CLIENT: ${CEPH_CLIENT:-odorobo}
      CEPH_IMAGE_NAME: ${CEPH_IMAGE_NAME:-dev-disk}
      CEPH_IMAGE_SIZE: ${CEPH_IMAGE_SIZE:-1G}
      CEPH_OSD_SIZE: ${CEPH_OSD_SIZE:-10G}
    volumes:
      - ceph_etc:/etc/ceph
      - ceph_lib:/var/lib/ceph
      - ceph_log:/var/log/ceph
      - ceph_run:/run/ceph
      - ceph_osd:/var/lib/odorobo-ceph
      - ceph_creds:/generated
      # Direct BlueStore initialization uses a host loop-backed block device.
      - /dev:/dev

    healthcheck:
      test: ["CMD", "ceph", "-s"]
      interval: 5s
      timeout: 5s
      retries: 30

  odorobo:
    build:
      context: ./odorobo
      dockerfile: Containerfile
    container_name: odorobo
    privileged: true
    depends_on:
      ceph:
        condition: service_healthy
      etcd:
        condition: service_healthy
    # podman-compose supports container namespace targets, but not the
    # Compose `service:ceph` shorthand.
    network_mode: container:odorobo-ceph
    pid: container:odorobo-ceph
    volumes:
      - ../../:/workspace
      - ceph_creds:/generated:ro
      - /dev:/dev
      # The rbd CLI runs `modprobe rbd` before mapping; the container's own
      # /lib/modules won't match the host's running kernel, so bind the host's
      # module tree in. modprobe finds rbd, sees it's already loaded on the
      # shared kernel, and skips the insmod.
      - /lib/modules:/lib/modules:ro
    working_dir: /workspace
    environment:
      CEPH_CONFIG: /generated/ceph.conf
      CEPH_ID: ${CEPH_CLIENT:-odorobo}
      CEPH_KEYFILE: /generated/client.${CEPH_CLIENT:-odorobo}.key
      CEPH_CLUSTER: ceph
      # Release compilation is memory-intensive; keep the default usable on
      # development laptops while allowing an override for faster machines.
      CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-2}
      ODOROBO_ETCD_ENDPOINTS: "${ODOROBO_ETCD_ENDPOINTS:-http://etcd:2379}"
      ODOROBO_HOSTNAME: "${ODOROBO_HOSTNAME:-odorobo}"
    command: ["cargo", "run", "--release", "-p", "odorobo", "--", "--manager-enabled", "true"]

volumes:
  ceph_etc:
  ceph_lib:
  ceph_log:
  ceph_run:
  ceph_osd:
  ceph_creds:
  etcd_data:
